name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: npx playwright install --with-deps chromium

      - name: Accessibility check (Storybook + axe)
        run: |
          pnpm --filter "{{packageScope}}/storybook" dev &
          npx wait-on http://localhost:6006 --timeout 60000
          pnpm --filter "{{packageScope}}/storybook" test:a11y
