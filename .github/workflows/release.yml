name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: changesets/action@v1
        with:
          # With zero pending changesets (true until the first real changeset
          # is merged), changesets/action skips the "open a Version PR" path
          # and runs this command directly — so guard it on NPM_TOKEN
          # actually being configured, rather than failing (and emailing)
          # on every push to main until publishing is set up for real.
          publish: sh -c 'if [ -n "$NODE_AUTH_TOKEN" ]; then pnpm release; else echo "NPM_TOKEN secret not set — skipping publish. Add it in repo settings when ready to publish for real (see CONTRIBUTING.md)."; fi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
