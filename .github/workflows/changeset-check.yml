name: Changeset check

on:
  pull_request:
    branches: [main]

jobs:
  changeset:
    # The "Version Packages" PR changesets/action opens consumes the
    # pending changeset(s) as part of creating itself, so by the time this
    # check runs against it, there are correctly zero pending changesets —
    # which `changeset status` otherwise treats as an error. Skip this one
    # PR type rather than have it permanently, falsely red.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --since=origin/main
